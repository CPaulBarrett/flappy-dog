<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flappy Dog 3D</title>
<style>
  html, body { margin: 0; height: 100%; background: #e9e4d8; }
  body { display: flex; align-items: center; justify-content: center; }
  #wrap {
    position: relative;
    height: min(96vh, 150vw);
    aspect-ratio: 2 / 3;
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 4px 24px rgba(0,0,0,.12);
    cursor: pointer;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #c { display: block; width: 100%; height: 100%; }
  #hud {
    position: absolute; inset: 0; pointer-events: none;
    font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: bold;
    color: #2f2f2f; text-align: center;
    container-type: size;
  }
  #hud div { position: absolute; left: 0; right: 0; transform: translateY(-80%); white-space: nowrap; }
  .big   { font-size: 9cqh; }
  .title { font-size: 6cqh; }
  .mid   { font-size: 3.7cqh; }
  .small { font-size: 2.7cqh; }
  .muted { color: #9a948a; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="hud">
    <div id="score" class="big"   style="top:13.3%"></div>
    <div id="t1"    class="title" style="top:25%"></div>
    <div id="t2"    class="mid"   style="top:38.3%"></div>
    <div id="t3"    class="mid muted" style="top:43.7%"></div>
    <div id="t4"    class="small muted" style="top:65%"></div>
    <div id="t5"    class="small muted" style="top:70%"></div>
  </div>
</div>
<script type="module">
import * as THREE from 'three';

const wrap = document.getElementById('wrap');
const cv = document.getElementById('c');
// Gameplay still runs in the original 400x600 logical plane (y down);
// it's rendered in 3D with that plane at z = 0.
const W = 400, H = 600;
const toX = x => x - W / 2;
const toY = y => H / 2 - y;

// ---------- palette ----------
const COL = { bg: '#f6f2e9', col: '#2f2f2f', ground: '#2f2f2f', groundTop: '#e8e1d2', far: '#e4ddcd' };

// ---------- renderer / scene ----------
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(COL.bg);
scene.fog = new THREE.Fog(COL.bg, 1100, 2400);

const camera = new THREE.PerspectiveCamera(40, W / H, 10, 5000);
const CAM_BASE = new THREE.Vector3(-150, 70, 790);
const CAM_LOOK = new THREE.Vector3(0, -10, 0);
camera.position.copy(CAM_BASE);
camera.lookAt(CAM_LOOK);

scene.add(new THREE.HemisphereLight(0xffffff, 0xcfc6b4, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.8);
sun.position.set(300, 600, 500);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -700, right: 700, top: 700, bottom: -700, near: 10, far: 2000 });
sun.shadow.bias = -0.0005;
scene.add(sun);

function resize() {
  const w = wrap.clientWidth, h = wrap.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(wrap);
resize();

// ---------- voxel dog ----------
const SPR_HEAD = [
  "..........DD....",
  ".........DBBB...",
  ".........DBKBB..",
  "D........BBBBBK.",
  ".D......BBBBBRR.",
  "..BBBBBBBBBBB...",
  "..BBWWWWBBBBB...",
  "..BBBBBBBBBB....",
];
const LEGS_A = ["..BB.BB..BB.BB..", "..K..K...K..K..."];
const LEGS_B = [".BB...BB.BB..BB.", ".K....K..K....K."];
const PAL = { B: '#b07a45', D: '#6b4426', K: '#1e1e1e', W: '#e8d8bf', R: '#d9576b' };
const PX = 3, LAYERS = 5;
const ROWS = SPR_HEAD.length + LEGS_A.length;
const DW = 16 * PX, DH = ROWS * PX;
const ALL = [0, 1, 2, 3, 4];

// Which depth layers each sprite pixel occupies (sprite is a side view).
function voxelsFor(ch, x, y) {
  if (y >= SPR_HEAD.length) return [1, 3].map(l => [l, ch]);          // legs, one per side
  if (ch === 'D' && x < 2) return [[2, ch]];                           // tail
  if (ch === 'D') return [1, 3].map(l => [l, ch]);                     // ears
  if (ch === 'K' && y === 2) return ALL.map(l => [l, l === 0 || l === 4 ? 'K' : 'B']); // eyes on both sides
  if (ch === 'K' || ch === 'R') return [1, 2, 3].map(l => [l, ch]);    // nose, tongue
  return ALL.map(l => [l, ch]);
}

const cube = new THREE.BoxGeometry(PX, PX, PX);
const mats = {};
for (const k in PAL) mats[k] = new THREE.MeshLambertMaterial({ color: PAL[k] });

function buildVoxels(rows, rowOffset) {
  const byColor = {};
  rows.forEach((r, ry) => [...r].forEach((ch, x) => {
    if (!PAL[ch]) return;
    const y = ry + rowOffset;
    for (const [l, c] of voxelsFor(ch, x, y)) (byColor[c] ??= []).push([x, y, l]);
  }));
  const g = new THREE.Group();
  const m = new THREE.Matrix4();
  for (const c in byColor) {
    const list = byColor[c];
    const im = new THREE.InstancedMesh(cube, mats[c], list.length);
    list.forEach(([x, y, l], i) => {
      m.makeTranslation((x - 7.5) * PX, (ROWS / 2 - 0.5 - y) * PX, (l - (LAYERS - 1) / 2) * PX);
      im.setMatrixAt(i, m);
    });
    im.castShadow = true;
    g.add(im);
  }
  return g;
}

const dogMesh = new THREE.Group();
dogMesh.add(buildVoxels(SPR_HEAD, 0));
const legsA = buildVoxels(LEGS_A, SPR_HEAD.length);
const legsB = buildVoxels(LEGS_B, SPR_HEAD.length);
dogMesh.add(legsA, legsB);
scene.add(dogMesh);

// ---------- world ----------
const GROUND = H - 60;
const GAP = 160, COL_W = 64, SPACING = 220, SPEED = 150;
const GRAVITY = 1500, FLAP_V = -430;
const SPAWN_X = W + 280;   // spawn further out than 2D so columns never pop into view
const COL_DEPTH = 64;

// ground slab
const groundY = toY(GROUND);
const slab = new THREE.Mesh(
  new THREE.BoxGeometry(4000, 400, 1600),
  new THREE.MeshLambertMaterial({ color: COL.groundTop })
);
slab.position.set(0, groundY - 200, -300);
slab.receiveShadow = true;
scene.add(slab);

// dark edge line along the play lane + scrolling dashes in front of it
const darkMat = new THREE.MeshLambertMaterial({ color: COL.ground });
const edge = new THREE.Mesh(new THREE.BoxGeometry(4000, 1.5, 6), darkMat);
edge.position.set(0, groundY + 0.75, COL_DEPTH / 2 + 6);
scene.add(edge);
const DASH_STEP = 24, DASH_N = 90;
const dashes = new THREE.InstancedMesh(new THREE.BoxGeometry(10, 1.5, 6), darkMat, DASH_N);
dashes.position.set(0, groundY + 0.75, COL_DEPTH / 2 + 26);
scene.add(dashes);
function placeDashes(off) {
  const m = new THREE.Matrix4();
  const x0 = -DASH_N / 2 * DASH_STEP;
  for (let i = 0; i < DASH_N; i++) {
    m.makeTranslation(x0 + i * DASH_STEP - off + 5, 0, 0);
    dashes.setMatrixAt(i, m);
  }
  dashes.instanceMatrix.needsUpdate = true;
}
placeDashes(0);

// distant parallax blocks
const farMat = new THREE.MeshLambertMaterial({ color: COL.far });
const far = [];
const FAR_SPAN = 3600;
for (let i = 0; i < 40; i++) {
  const w = 60 + Math.random() * 140, h = 80 + Math.random() * 520, d = 60 + Math.random() * 140;
  const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), farMat);
  b.position.set(-FAR_SPAN / 2 + Math.random() * FAR_SPAN, groundY + h / 2, -500 - Math.random() * 900);
  b.receiveShadow = true;
  far.push(b); scene.add(b);
}

// columns
const colMat = new THREE.MeshStandardMaterial({ color: COL.col, roughness: 0.85, metalness: 0 });
const colGeo = new THREE.BoxGeometry(1, 1, 1);
function colPart() {
  const m = new THREE.Mesh(colGeo, colMat);
  m.castShadow = m.receiveShadow = true;
  scene.add(m);
  return m;
}
const COL_TOP_EXTRA = 900; // extend top columns well above the visible frame

// ---------- sound ----------
let ac = null;
function audio() { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); return ac; }
function tone(type, f0, f1, dur, vol = 0.15, delay = 0) {
  const a = audio(), t = a.currentTime + delay;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(a.destination);
  o.start(t); o.stop(t + dur);
}
const sfx = {
  flap:  () => tone('square', 380, 620, 0.08, 0.06),
  point: () => { tone('square', 880, 880, 0.07, 0.06); tone('square', 1320, 1320, 0.1, 0.06, 0.07); },
  bark:  () => { tone('sawtooth', 520, 180, 0.12, 0.2); tone('sawtooth', 480, 160, 0.14, 0.18, 0.16); },
};

// ---------- game state ----------
let state, dog, cols, score, best, t, deadAt;

try { best = +localStorage.getItem('flappyDogBest') || 0; } catch { best = 0; }

function clearCols() {
  if (cols) for (const c of cols) { scene.remove(c.top3, c.bot3); }
  cols = [];
}

function reset() {
  state = 'ready';
  dog = { x: 100, y: H / 2 - 40, vy: 0 };
  clearCols();
  score = 0; t = 0;
}
reset();

function spawn(x) {
  const top = 70 + Math.random() * (GROUND - GAP - 140);
  const c = { x, top, passed: false, top3: colPart(), bot3: colPart() };
  const topH = top + COL_TOP_EXTRA, botH = GROUND - top - GAP;
  c.top3.scale.set(COL_W, topH, COL_DEPTH);
  c.top3.position.y = toY(top - topH / 2);
  c.bot3.scale.set(COL_W, botH, COL_DEPTH);
  c.bot3.position.y = toY(top + GAP + botH / 2);
  cols.push(c);
}

// keep columns filled out to SPAWN_X at exact SPACING
function fillCols() {
  while (cols[cols.length - 1].x < SPAWN_X - SPACING) spawn(cols[cols.length - 1].x + SPACING);
}

function flap() {
  if (state === 'ready') { state = 'play'; spawn(W + 40); fillCols(); }
  if (state === 'play') { dog.vy = FLAP_V; sfx.flap(); }
  else if (state === 'over' && performance.now() - deadAt > 500) reset();
}

function die() {
  state = 'over'; deadAt = performance.now();
  sfx.bark();
  if (score > best) { best = score; try { localStorage.setItem('flappyDogBest', best); } catch {} }
}

// ---------- input ----------
addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); if (!e.repeat) flap(); }
});
wrap.addEventListener('pointerdown', e => { e.preventDefault(); flap(); });

// ---------- loop ----------
let scroll = 0;
function update(dt) {
  t += dt;
  if (state === 'ready') { dog.y = H / 2 - 40 + Math.sin(t * 4) * 8; return; }
  if (state === 'over') {
    if (dog.y + DH < GROUND) { dog.vy += GRAVITY * dt; dog.y = Math.min(dog.y + dog.vy * dt, GROUND - DH); }
    return;
  }
  scroll += SPEED * dt;
  dog.vy += GRAVITY * dt;
  dog.y += dog.vy * dt;

  for (const c of cols) c.x -= SPEED * dt;
  if (cols.length) fillCols();
  while (cols.length && cols[0].x + COL_W < -300) { const c = cols.shift(); scene.remove(c.top3, c.bot3); }

  // collision (slightly forgiving hitbox)
  const hx = dog.x + 4, hy = dog.y + 4, hw = DW - 8, hh = DH - 6;
  if (hy + hh >= GROUND) { dog.y = GROUND - DH; return die(); }
  if (hy < 0) { dog.y = -4; dog.vy = 0; }
  for (const c of cols) {
    if (hx + hw > c.x && hx < c.x + COL_W && (hy < c.top || hy + hh > c.top + GAP)) return die();
    if (!c.passed && c.x + COL_W < dog.x) { c.passed = true; score++; sfx.point(); }
  }
}

// ---------- HUD ----------
const hud = Object.fromEntries(['score', 't1', 't2', 't3', 't4', 't5'].map(id => [id, document.getElementById(id)]));
const hudCache = {};
function setHud(id, s) { if (hudCache[id] !== s) { hudCache[id] = s; hud[id].textContent = s; } }
const hudTop = (id, y) => { hud[id].style.top = (y / H * 100) + '%'; };

function drawHud() {
  const ready = state === 'ready', over = state === 'over', play = state === 'play';
  setHud('score', play ? String(score) : '');
  if (ready) {
    hudTop('t1', 150); hudTop('t4', 390); hudTop('t5', 420);
    setHud('t1', 'FLAPPY DOG'); setHud('t2', ''); setHud('t3', '');
    setHud('t4', 'space / click to flap');
    setHud('t5', best ? 'best ' + best : '');
  } else if (over) {
    hudTop('t1', 170); hudTop('t2', 230); hudTop('t3', 262); hudTop('t4', 330);
    setHud('t1', 'GAME OVER'); setHud('t2', 'score ' + score); setHud('t3', 'best ' + best);
    setHud('t4', performance.now() - deadAt > 500 ? 'space / click to retry' : '');
    setHud('t5', '');
  } else {
    for (const id of ['t1', 't2', 't3', 't4', 't5']) setHud(id, '');
  }
}

// ---------- render ----------
function draw(dt) {
  // dog
  const walk = state !== 'over' && Math.floor(t * 8) % 2 === 1;
  legsA.visible = !walk; legsB.visible = walk;
  const ang = state === 'ready' ? 0 : Math.max(-0.4, Math.min(1.2, dog.vy / 700));
  dogMesh.position.set(toX(dog.x + DW / 2), toY(dog.y + DH / 2), 0);
  dogMesh.rotation.z = -ang;
  dogMesh.rotation.y = state === 'ready' ? Math.sin(t * 1.5) * 0.35 : 0;

  // columns
  for (const c of cols) {
    const x = toX(c.x + COL_W / 2);
    c.top3.position.x = c.bot3.position.x = x;
  }

  // ground dashes and parallax
  if (state === 'play') {
    placeDashes(scroll % DASH_STEP);
    for (const b of far) {
      b.position.x -= SPEED * 0.35 * dt;
      if (b.position.x < -FAR_SPAN / 2) b.position.x += FAR_SPAN;
    }
  }

  // camera gently follows the dog's height
  const targetY = CAM_BASE.y + toY(dog.y + DH / 2) * 0.12;
  camera.position.y += (targetY - camera.position.y) * Math.min(1, dt * 3);
  camera.lookAt(CAM_LOOK.x, CAM_LOOK.y + (camera.position.y - CAM_BASE.y) * 0.5, CAM_LOOK.z);

  renderer.render(scene, camera);
  drawHud();
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  update(dt);
  draw(dt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
